<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>MyFin</title>
<style>
:root{--bg:#F4F5FB;--card:#fff;--tx:#1B1E3A;--mut:#6B7094;--pri:#4F46E5;--pri2:#EEF0FF;--ok:#16A34A;--warn:#F59E0B;--bad:#DC2626;--line:#E4E6F2;--sh:0 4px 16px rgba(30,30,80,.07)}
[data-theme=dark]{--bg:#0F1020;--card:#1A1B30;--tx:#EEF0FF;--mut:#9A9EC4;--pri:#7C75FF;--pri2:#26274A;--line:#2C2E52;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:16px 16px 100px}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:6px 0}h3{font-size:16px;margin:0}
p{color:var(--mut);line-height:1.45}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff}
.hero .big{font-size:34px;font-weight:800;margin:4px 0}.hero small{opacity:.85}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid3 div{background:rgba(255,255,255,.15);border-radius:12px;padding:8px;text-align:center;font-size:12px}
.grid3 b{display:block;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;margin:8px 0}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.ghost{background:none;color:var(--mut);font-weight:600}
.btn.danger{background:#FEE2E2;color:var(--bad)}.btn:disabled{opacity:.4}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:2px}
input,select{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin:6px 0}
label{font-size:13px;color:var(--mut);font-weight:600}
.opt{border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.opt.on{border-color:var(--pri);background:var(--pri2)}.opt b{display:block;margin-bottom:2px}.opt span{color:var(--mut);font-size:13px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;border-radius:6px}
.g{background:var(--ok)}.y{background:var(--warn)}.r{background:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat{cursor:pointer}.cat .top{display:flex;justify-content:space-between;font-weight:700}
.sub{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.insight{display:flex;gap:10px;align-items:center;font-weight:600}
.insight.ok{background:#DCFCE7;color:#14532D}.insight.warn{background:#FEF3C7;color:#78350F}.insight.bad{background:#FEE2E2;color:#7F1D1D}
.sum{position:sticky;top:0;z-index:5;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);font-size:13px}
.sum .row{padding:2px 0}.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok);font-weight:700}
.dr{display:grid;grid-template-columns:1fr 110px 70px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dr input{margin:0;padding:9px;text-align:right}.dr .c{text-align:right;color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:10}
nav button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;flex:1}
nav button span{font-size:20px}nav button.on{color:var(--pri);font-weight:700}
nav .plus{flex:0 0 58px;height:58px;border-radius:50%;background:var(--pri);color:#fff;font-size:30px;margin-top:-26px;box-shadow:0 6px 16px rgba(79,70,229,.45);justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{padding:8px 12px;border-radius:20px;background:var(--pri2);color:var(--pri);font-size:13px;font-weight:600;cursor:pointer;border:2px solid transparent}.chip.on{border-color:var(--pri)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mhead button{background:var(--card);border:0;border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--tx);cursor:pointer;box-shadow:var(--sh)}
.bar{height:5px;background:var(--line);border-radius:4px;margin:0 0 14px}.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-120px);background:#1B1E3A;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;transition:.3s;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,10,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 20px 28px}
.mv{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}
.mv .a{font-weight:700}.mv small{color:var(--mut);display:block}
.logo{font-size:44px}.center{text-align:center}.tiny{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.mini{display:flex;gap:6px;margin-top:6px}
.seg{display:flex;background:var(--pri2);border-radius:14px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:700;color:var(--pri);font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:var(--pri2);border-radius:14px;padding:10px}.kpi small{color:var(--mut);display:block;font-size:11px}.kpi b{font-size:17px}
.leg{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.pv{margin:8px 0}.pv .l{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.pv .b{height:7px;border-radius:5px;background:var(--line);margin:3px 0;overflow:hidden}.pv .b i{display:block;height:100%;border-radius:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:10px}
.cal .h{color:var(--mut);font-weight:700;padding:2px 0}.cal .d{border-radius:8px;padding:5px 0;min-height:38px;cursor:pointer;border:1.5px solid transparent;color:var(--tx)}.cal .d b{display:block;font-size:11px}.cal .d.sel{border-color:var(--pri)}
.wk{display:flex;align-items:flex-end;gap:6px;height:110px}.wk div{flex:1;text-align:center;font-size:10px;color:var(--mut)}.wk i{display:block;background:var(--pri);border-radius:6px 6px 0 0;margin-bottom:3px}
svg text{font-family:inherit}
.onlyprint{display:none}
@media print{body{background:#fff}nav,#toast,.noprint,.modal,.seg{display:none!important}#app{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.onlyprint{display:block}.hero{background:#4F46E5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}svg,.pv .b i,.prog i,.cal .d{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ DATOS ============ */
const KEY='myfin_v1';
let DB; try{DB=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DB=null}
DB=DB||{users:{},session:null};
const persist=()=>localStorage.setItem(KEY,JSON.stringify(DB));
let D=null;
const CATS0=[['vivienda','🏠','Vivienda',35],['comida','🍽️','Comida',20],['transporte','🚌','Transporte',7],['ocio','🎉','Ocio',12],['suscripciones','📺','Suscripciones',3],['compras','🛍️','Compras',8],['deporte','🏋️','Deporte',4],['estudios','📚','Estudios',5],['otros','📦','Otros',6]];
const S={screen:'welcome',tab:'home',view:null,auth:{mode:'new',email:'',pass:'',name:'',err:''},ob:{step:3,type:'fixed',income:'',saveMode:'none',saveValue:'',method:'manual'},
  draft:null,exp:null,back:'home',catId:null,filters:{cat:'',sort:'date'},modal:null,nm:{income:'',checks:{},choice:{}},closeKey:null,imp:null,rep:{seg:'mes',day:null}};

/* ============ UTILIDADES ============ */
const $id=i=>document.getElementById(i);
const r2=n=>Math.round((+n||0)*100)/100;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{const v=r2(n);return v.toLocaleString('es-ES',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2})+' €'};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
const mkey=d=>d.slice(0,7);
const curKey=()=>todayISO().slice(0,7);
const shiftKey=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mLabel=k=>{const [y,m]=k.split('-').map(Number);const s=new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)};
const dim=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const dLabel=d=>{const t=todayISO();if(d===t)return'Hoy';const y=new Date();y.setDate(y.getDate()-1);if(d===iso(y))return'Ayer';const [yy,mm,dd]=d.split('-').map(Number);return dd+' '+new Date(yy,mm-1,dd).toLocaleDateString('es-ES',{month:'long'})};
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
function fhash(s){let a=5381,b=52711;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=((a*33)^c)>>>0;b=((b*31)+c*17)>>>0}return 'f'+a.toString(16)+b.toString(16)+s.length}
async function sha(s){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return fhash(s)}
let tt;function toast(msg){const t=$id('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}
function notify(msg){toast(msg);try{if(D&&D.ui.notif&&'Notification' in window&&Notification.permission==='granted')new Notification('MyFin',{body:msg})}catch(e){}}

/* ============ LÓGICA ============ */
const save=()=>{if(D)D.updatedAt=Date.now();persist();if(typeof gAutoSync==='function')gAutoSync()};
const catOf=id=>D.cats.find(c=>c.id===id);
const catName=id=>{const c=catOf(id);return c?c.emoji+' '+c.name:'❔ Sin categoría'};
const saveAmt=m=>m.saveMode==='fixed'?r2(m.saveValue):m.saveMode==='pct'?r2(m.income*m.saveValue/100):0;
const baseBudget=(m,id)=>{const a=+m.alloc[id]||0;return m.method==='pct'?r2(m.income*a/100):r2(a)};
const catBudget=(k,id)=>{const m=D.months[k];if(!m)return 0;return Math.max(0,r2(baseBudget(m,id)-(+m.carry[id]||0)+((m.bonus||{})[id]||0)))};
const spentCat=(k,id)=>r2(D.expenses.filter(e=>mkey(e.date)===k&&e.cat===id&&!e.nb).reduce((s,e)=>s+e.amount,0));
const spentTot=k=>r2(D.expenses.filter(e=>mkey(e.date)===k&&!e.nb).reduce((s,e)=>s+e.amount,0));
const stateCls=(sp,b)=>{if(b<=0)return sp>0?'r':'g';const p=sp/b;return p>1?'r':p>=0.8?'y':'g'};
const prevMonthKey=k=>Object.keys(D.months).filter(x=>x<k).sort().pop();
function projection(k){const m=D.months[k];const sp=spentTot(k);if(k!==curKey())return r2(m.income-sp);const day=new Date().getDate();return r2(m.income-(sp/day)*dim(k))}
function excesses(k){const m=D.months[k];if(!m)return[];return D.cats.map(c=>({id:c.id,ex:r2(spentCat(k,c.id)-catBudget(k,c.id))})).filter(x=>x.ex>0.004&&catBudget(k,x.id)>0)}

/* ============ ACCIONES ============ */
const A={
  go(tab,opts){opts=opts||{};S.tab=tab;S.screen='app';if(tab==='budget')S.draft=null;if(tab==='add'){S.back=opts.back||(S.tab==='add'?'home':S.back);S.exp=opts.exp||{id:null,amount:'',cat:opts.cat||(D.cats[0]&&D.cats[0].id)||'',date:todayISO(),note:''}}if(opts.cat&&tab==='cat')S.catId=opts.cat;render();window.scrollTo(0,0)},
  nav(tab){if(tab==='add'){S.back=S.tab==='add'?'home':S.tab;A.go('add',{back:S.back})}else A.go(tab)},
  month(n){S.view=shiftKey(S.view,n);S.draft=null;S.rep.day=null;S.nm={income:'',checks:{},choice:{}};render()},
  start(){S.auth.mode='new';S.screen='auth';render()},
  haveAcc(){S.auth.mode='login';S.screen='auth';render()},
  authSet(f,v){S.auth[f]=v},
  async submitAuth(){
    const a=S.auth,email=a.email.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)){a.err='Introduce un email válido';return render()}
    if(a.pass.length<6){a.err='La contraseña debe tener al menos 6 caracteres';return render()}
    const h=await sha(a.pass);
    if(a.mode==='new'){
      if(DB.users[email]){a.err='Ya existe una cuenta con ese email';return render()}
      DB.users[email]={hash:h,data:{name:a.name.trim()||email.split('@')[0],email:email,settings:{onboarded:false,incomeType:'fixed',fixedIncome:0,saveMode:'none',saveValue:0,method:'manual'},cats:CATS0.map(c=>({id:c[0],emoji:c[1],name:c[2]})),months:{},expenses:[],goals:[],rules:{},pending:{},ui:{dark:false,notif:false}}};
      DB.session=email;D=DB.users[email].data;save();a.err='';S.screen='ob';S.ob.step=3;render()
    }else{
      const u=DB.users[email];if(!u||(u.hash!==h&&u.hash!==fhash(a.pass))){a.err='Email o contraseña incorrectos';return render()}
      DB.session=email;D=u.data;save();a.err='';A.afterLogin()
    }
  },
  afterLogin(){ensureData();runAutos();applyTheme();S.view=curKey();if(!D.settings.onboarded){S.screen='ob';S.ob.step=3}else{S.screen='app';S.tab='home'}render()},
  obSet(f,v){S.ob[f]=v},
  obPick(f,v){S.ob[f]=v;render()},
  obNext(){
    const o=S.ob;
    if(o.step===3){if(num(o.income)<=0){toast('Introduce un ingreso mayor que 0');return}o.step=4}
    else if(o.step===4){if(o.saveMode!=='none'&&num(o.saveValue)<=0){toast('Introduce una cantidad de ahorro');return}
      if(o.saveMode==='pct'&&num(o.saveValue)>=100){toast('El porcentaje debe ser menor que 100');return}
      if(o.saveMode==='fixed'&&num(o.saveValue)>=num(o.income)){toast('El ahorro debe ser menor que el ingreso');return}o.step=5}
    else if(o.step===5){S.draft={k:'ob',method:o.method,alloc:{}};o.step=6}
    else if(o.step===6){if(!distValid(S.draft,num(o.income),obSave())){toast('Revisa el reparto antes de continuar');return}o.step=7}
    render();window.scrollTo(0,0)
  },
  obBack(){const o=S.ob;if(o.step>3){o.step--;if(o.step===6)o.step=5;render()}},
  obFinish(){
    const o=S.ob,k=curKey(),inc=num(o.income);
    D.settings=Object.assign(D.settings,{onboarded:true,incomeType:o.type,fixedIncome:o.type==='fixed'?inc:0,saveMode:o.saveMode,saveValue:num(o.saveValue),method:S.draft.method});
    D.months[k]={income:inc,saveMode:o.saveMode,saveValue:num(o.saveValue),method:S.draft.method,alloc:cloneAlloc(S.draft.alloc),carry:{},bonus:{},closed:false};
    save();S.draft=null;S.screen='app';S.tab='home';S.view=k;render()
  },
  dist(id,v){S.draft.alloc[id]=v===''?'':num(v);updDist()},
  suggest(){
    const d=S.draft,ctx=distCtx();const pc=D.cats.map(c=>{const f=CATS0.find(x=>x[0]===c.id);return[c.id,f?f[3]:5]});const tot=pc.reduce((s,x)=>s+x[1],0);
    pc.forEach(([id,p])=>{const share=p/tot;d.alloc[id]=d.method==='pct'?r2(ctx.availPct*share):r2((ctx.income-ctx.save)*share)});
    render()
  },
  toggleMethod(){
    const d=S.draft,ctx=distCtx();const to=d.method==='pct'?'manual':'pct';
    D.cats.forEach(c=>{const v=+d.alloc[c.id]||0;d.alloc[c.id]=to==='pct'?r2(v/ctx.income*100):r2(v*ctx.income/100)});
    d.method=to;if(S.screen==='ob')S.ob.method=to;render()
  },
  modal(type,id){S.modal={type:type,id:id||null,v:'',v2:'',f:{}};if(typeof initModal==='function')initModal(S.modal);
    if(type==='cat-rename'){S.modal.v=catOf(id).name}
    if(type==='income'){const m=D.months[S.view];S.modal.v=m?String(m.income):''}
    if(type==='saving'){const m=D.months[S.view];S.modal.v=m?m.saveMode:'none';S.modal.v2=m&&m.saveValue?String(m.saveValue):''}
    render()},
  mset(f,v){S.modal[f]=v},
  mpick(v){S.modal.v=v;render()},
  closeModal(){S.modal=null;render()},
  modalOk(){
    const M=S.modal;
    if(M.type==='cat-add'||M.type==='cat-rename'){
      const n=M.v.trim();if(!n){toast('Escribe un nombre');return}
      if(M.type==='cat-add')D.cats.push({id:uid(),emoji:'🔖',name:n});else catOf(M.id).name=n;
      save();S.modal=null;render()
    }else if(M.type==='income'){
      const v=num(M.v);if(v<=0){toast('Introduce un importe válido');return}
      const m=D.months[S.view];const old=m.income;m.income=v;
      if(m.method==='manual'&&old>0&&confirm('¿Recalcular el reparto proporcionalmente al nuevo ingreso?\n(Cancelar = mantener los importes actuales)')){Object.keys(m.alloc).forEach(id=>m.alloc[id]=r2(m.alloc[id]*v/old))}
      if(D.settings.incomeType==='fixed')D.settings.fixedIncome=v;
      save();S.modal=null;S.draft=null;toast('Ingreso actualizado');render()
    }else if(M.type==='saving'){
      const m=D.months[S.view];const val=num(M.v2);
      if(M.v!=='none'&&val<=0){toast('Introduce un valor');return}
      m.saveMode=M.v;m.saveValue=M.v==='none'?0:val;D.settings.saveMode=m.saveMode;D.settings.saveValue=m.saveValue;
      save();S.modal=null;S.draft=null;toast('Ahorro actualizado');render()
    }
  },
  delCat(id){if(!confirm('¿Eliminar esta categoría? Sus gastos quedarán como "Sin categoría".'))return;D.cats=D.cats.filter(c=>c.id!==id);Object.values(D.months).forEach(m=>{delete m.alloc[id];delete m.carry[id]});if(S.draft)delete S.draft.alloc[id];save();render()},
  saveBudget(){
    const m=D.months[S.view],d=S.draft;
    if(!distValid(d,m.income,saveAmt(m))){toast('Revisa el reparto: no se puede guardar');return}
    m.method=d.method;m.alloc=cloneAlloc(d.alloc);D.settings.method=d.method;save();toast('Presupuesto actualizado');S.draft=null;render()
  },
  nmSet(v){S.nm.income=v},
  expSet(f,v){S.exp[f]=v;if(f==='amount'||f==='date')updHint()},
  expCat(id){S.exp.cat=id;render()},
  expDate(v){S.exp.date=v;updHint()},
  saveExp(){
    const e=S.exp,amt=r2(num(e.amount));
    if(amt<=0){toast('Introduce un importe');return}
    if(!e.cat||!catOf(e.cat)){toast('Elige una categoría');return}
    if(!e.date){toast('Elige una fecha');return}
    const k=mkey(e.date),before=spentCat(k,e.cat);
    if(e.id){const x=D.expenses.find(z=>z.id===e.id);spendAdj(x,1);Object.assign(x,{amount:amt,cat:e.cat,date:e.date,note:e.note.trim()},x.src==='bank'?{}:{acc:payAcc(e),nb:payNb(e)});spendAdj(x,-1)}
    else{const nx={id:uid(),amount:amt,cat:e.cat,date:e.date,note:e.note.trim(),acc:payAcc(e),nb:payNb(e)};D.expenses.push(nx);spendAdj(nx,-1)}
    save();
    const b=catBudget(k,e.cat),after=spentCat(k,e.cat),name=catOf(e.cat).name.toLowerCase();
    if(payNb(e)){const pa=accById(payAcc(e));toast('Gasto con cargo a '+(pa?pa.name:'ahorros')+(pa?': quedan '+money(pa.balance):''))}
    else if(D.months[k]&&b>0&&after>b&&before<=b+0.001)notify('Te has pasado '+money(after-b)+' en '+name);
    else if(D.months[k]&&b>0&&after>b)notify('Sigues por encima en '+name+': +'+money(after-b));
    else if(D.months[k])toast((e.id?'Gasto actualizado':'Gasto añadido')+' · Te quedan '+money(b-after)+' en '+name);

    S.view=k;const bk=S.back==='cat'?'cat':S.back==='moves'?'moves':'home';A.go(bk)
  },
  editExp(id){const x=D.expenses.find(z=>z.id===id);S.back=S.tab;A.go('add',{back:S.tab,exp:{id:x.id,amount:String(x.amount),cat:x.cat,date:x.date,note:x.note||'',bank:x.src==='bank',src:(x.acc&&x.acc!==D.settings.spendAcc)?x.acc:'paga',count:!x.nb}})},
  delExp(id){if(!confirm('¿Eliminar este gasto?'))return;spendAdj(D.expenses.find(x=>x.id===id),1);D.expenses=D.expenses.filter(x=>x.id!==id);save();toast('Gasto eliminado');render()},

  closeMonth(k){S.closeKey=k;S.tab='close';render();window.scrollTo(0,0)},

  reset(){if(!confirm('¿Reiniciar el presupuesto de este mes? Se borrará el reparto, pero no tus gastos.'))return;const m=D.months[S.view];m.alloc={};m.carry={};save();S.draft=null;toast('Presupuesto reiniciado');A.go('budget')},
  dark(){D.ui.dark=!D.ui.dark;applyTheme();save();render()},

  logout(){DB.session=null;save();D=null;S.screen='welcome';render()},

};
const cloneAlloc=a=>{const o={};Object.keys(a).forEach(k=>o[k]=a[k]===''?0:+a[k]);return o};
function applyTheme(){document.documentElement.setAttribute('data-theme',D&&D.ui.dark?'dark':'light')}

/* ============ REPARTO (componente compartido) ============ */
function obSave(){const o=S.ob;return o.saveMode==='fixed'?r2(num(o.saveValue)):o.saveMode==='pct'?r2(num(o.income)*num(o.saveValue)/100):0}
function distCtx(){
  const d=S.draft;let income,save_;
  if(S.screen==='ob'){income=num(S.ob.income);save_=obSave()}else{const m=D.months[S.view];income=m.income;save_=saveAmt(m)}
  const availPct=r2(100-save_/income*100);
  const used=D.cats.reduce((s,c)=>s+(+d.alloc[c.id]||0),0);
  const avail=d.method==='pct'?availPct:r2(income-save_);
  return{income:income,save:save_,availPct:availPct,avail:avail,used:r2(used),rest:r2(avail-used),method:d.method}
}
function distValid(d,income,save_){
  const used=D.cats.reduce((s,c)=>s+(+d.alloc[c.id]||0),0);
  if(d.method==='pct'){const avail=100-save_/income*100;return Math.abs(avail-used)<0.011}
  return used<=income-save_+0.005
}
function distSummaryHTML(){
  const c=distCtx(),pct=c.method==='pct',f=n=>pct?r2(n)+'%':money(n);
  const bad=c.rest<-0.005,ok=pct?Math.abs(c.rest)<0.011:c.rest>=-0.005;
  return '<div class="row"><span>Ingreso</span><b>'+money(c.income)+'</b></div>'+
   '<div class="row"><span>Ahorro</span><b>'+(c.save?money(c.save)+(pct?' ('+r2(100-c.availPct)+'%)':''):'—')+'</b></div>'+
   '<div class="row"><span>'+(pct?'Porcentaje a repartir':'Disponible para repartir')+'</span><b>'+f(c.avail)+'</b></div>'+
   '<div class="row"><span>'+(pct?'Usado':'Ya repartido')+'</span><b>'+f(c.used)+'</b></div>'+
   '<div class="row"><span>Restante</span><b class="'+(bad?'neg':ok&&Math.abs(c.rest)<0.011?'pos':'')+'">'+f(c.rest)+'</b></div>'+
   (bad?'<div class="neg" style="margin-top:4px">⚠️ Te has pasado '+f(-c.rest)+'</div>':pct&&!ok?'<div class="tiny" style="margin-top:4px">Te queda un '+r2(c.rest)+'% sin asignar. Hay que llegar al 100%.</div>':'')
}
function distRowsHTML(extra){
  const d=S.draft,ctx=distCtx();
  return D.cats.map(c=>{const v=d.alloc[c.id];const amt=d.method==='pct'?money(ctx.income*(+v||0)/100):'';
    return '<div class="dr"><div>'+c.emoji+' '+esc(c.name)+(extra?extra(c):'')+'</div><input type="number" inputmode="decimal" step="0.01" min="0" placeholder="0" value="'+(v===undefined||v===''||v===0?'':v)+'" oninput="A.dist(\''+c.id+'\',this.value)"><div class="c" id="amt-'+c.id+'">'+(d.method==='pct'?amt:'€')+'</div></div>'}).join('')
}
function updDist(){
  const s=$id('distSum');if(s)s.innerHTML=distSummaryHTML();
  const ctx=distCtx();if(S.draft.method==='pct')D.cats.forEach(c=>{const e=$id('amt-'+c.id);if(e)e.textContent=money(ctx.income*(+S.draft.alloc[c.id]||0)/100)});
  const b=$id('distBtn');if(b)b.disabled=!distValid(S.draft,ctx.income,ctx.save)
}

function render(){
  if(D)ensureData();
  const app=$id('app');let h='';
  if(S.screen==='welcome')h=vWelcome();
  else if(S.screen==='auth')h=vAuth();
  else if(S.screen==='ob')h=vOnboarding();
  else{
    const t=S.tab;
    h=t==='home'?vHome():t==='budget'?vBudget():t==='add'?vAdd():t==='moves'?vMoves():t==='cat'?vCat():t==='close'?vClose():t==='goals'?vGoals():t==='import'?vImport():t==='report'?vReport():t==='wealth'?vWealth():vProfile();
    h+=vNav()
  }
  app.innerHTML=h+vModal();
  if(S.screen==='app'&&S.tab==='add'){updHint();const a=$id('amt');if(a&&!S.exp.id&&!S.modal)try{a.focus()}catch(e){}}
}

S.wl={seg:'cuentas',months:12,exp:''};S.g={busy:''};
function ensureData(){D.goals=D.goals||[];D.rules=D.rules||{};D.pending=D.pending||{};D.accounts=D.accounts||[];D.flows=D.flows||[];D.atx=D.atx||[];D.settings.google=D.settings.google||{clientId:'',auto:false};if(D.settings.taxPct===undefined)D.settings.taxPct=0;if(!D.plan)D.plan=DEFAULT_PLAN}
const goalSaved=g=>r2(g.contribs.reduce((s,c)=>s+c.amount,0));
const goalMonth=(g,k)=>r2(g.contribs.filter(c=>c.month===k).reduce((s,c)=>s+c.amount,0));
const monthDiff=(a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return(by-ay)*12+(bm-am)};
const fmtD=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
function extraAvail(k){const m=D.months[k];if(!m)return 0;return Math.max(0,r2(m.income-spentTot(k)-saveAmt(m)-(m.distributed||0)))}
function addContrib(g,amount,type,k,accId){const c={id:uid(),month:k,date:todayISO(),amount:r2(amount),type:type};const a=accId&&accById(accId);if(a){a.balance=r2(a.balance-amount);logTx(a.id,-amount,'goal',(amount>=0?'Aportación a ':'Retirada de ')+g.name);c.acc=a.id}g.contribs.push(c)}
function goalInfo(g){
  const sv=goalSaved(g),rem=Math.max(0,r2(g.target-sv)),pct=g.target>0?Math.min(100,sv/g.target*100):0;let eta='',need='';
  if(rem<=0)eta='¡Objetivo conseguido! 🎉';
  else if(g.monthly>0){const n=Math.ceil(rem/g.monthly);eta='Con '+money(g.monthly)+'/mes llegas en '+n+(n>1?' meses':' mes')+' ('+mLabel(shiftKey(curKey(),n))+')'}
  else eta='Sin aportación mensual definida';
  if(rem>0&&g.deadline){const n=Math.max(1,monthDiff(curKey(),g.deadline)+1);need='Para llegar en '+mLabel(g.deadline)+' necesitas '+money(rem/n)+'/mes'+(g.monthly>0&&g.monthly+0.005<rem/n?' ⚠️ (ahora planeas '+money(g.monthly)+')':' ✅')}
  return{sv:sv,rem:rem,pct:pct,eta:eta,need:need}
}
function vGoals(){
  const k=curKey(),m=D.months[k],sv=m?saveAmt(m):0,plan=r2(D.goals.reduce((s,g)=>s+(+g.monthly||0),0));
  let h='<div class="row"><h3>Objetivos 🎯</h3><span><button class="btn sec sm" onclick="S.rep.seg=\'obj\';A.nav(\'report\')">📈 Gráficos</button><button class="btn sec sm" onclick="A.modal(\'goal\')">+ Nuevo</button></span></div>';
  if(!D.goals.length)return h+'<div class="card center"><div class="logo">🚗</div><h3>Crea tu primera hucha</h3><p>Fija una meta (coche, viaje, portátil…) y cuánto aportarás cada mes. MyFin suma tus aportaciones y te dice cuándo llegarás.</p><button class="btn" onclick="A.modal(\'goal\')">Crear objetivo</button></div>';
  if(m&&plan>sv+0.005)h+='<div class="card insight warn">⚠️ Tus aportaciones planificadas ('+money(plan)+'/mes) superan tu ahorro objetivo ('+money(sv)+'). Sube el ahorro o baja alguna aportación.</div>';
  else if(m)h+='<div class="tiny" style="margin:4px 0">De tu ahorro objetivo de '+money(sv)+', '+money(plan)+' van a objetivos cada mes.</div>';
  return h+D.goals.map(g=>{
    const i=goalInfo(g),done=goalMonth(g,k),canPlan=g.monthly>0&&done+0.005<g.monthly&&i.rem>0;
    return '<div class="card"><div class="row"><h3>'+g.emoji+' '+esc(g.name)+'</h3><span class="tiny">'+Math.round(i.pct)+'%</span></div>'+
     '<div style="font-size:22px;font-weight:800;margin-top:6px">'+money(i.sv)+' <span class="tiny" style="font-size:13px">de '+money(g.target)+'</span></div>'+
     '<div class="prog"><i class="g" style="width:'+i.pct+'%"></i></div><div class="sub"><span>Faltan '+money(i.rem)+'</span><span>Este mes: '+money(done)+(g.monthly>0?' / '+money(g.monthly):'')+'</span></div>'+
     '<p class="tiny" style="margin:8px 0 0">'+i.eta+'</p>'+(g.fromAcc&&accById(g.fromAcc)?'<p class="tiny" style="margin:2px 0 0">💰 Las aportaciones salen de '+esc(accById(g.fromAcc).name)+'</p>':'')+(i.need?'<p class="tiny" style="margin:2px 0 0">'+i.need+'</p>':'')+
     '<div class="mini" style="flex-wrap:wrap">'+(canPlan?'<button class="btn sm" onclick="A.planContrib(\''+g.id+'\')">Aportar '+money(g.monthly-done)+'</button>':'')+
     '<button class="btn sec sm" onclick="A.modal(\'contrib\',\''+g.id+'\')">+ Otra cantidad</button><button class="btn sec sm" onclick="A.modal(\'goal\',\''+g.id+'\')">✏️</button><button class="btn danger sm" onclick="A.delGoal(\''+g.id+'\')">🗑️</button></div>'+
     (g.contribs.length?'<details style="margin-top:8px"><summary class="tiny">Historial ('+g.contribs.length+')</summary>'+g.contribs.slice().reverse().map(c=>'<div class="mv" style="padding:6px 0"><div><b>'+(c.amount>=0?'+':'')+money(c.amount)+'</b><small>'+fmtD(c.date)+' · '+(c.type==='extra'?'extra de '+mLabel(c.month):c.type==='plan'?'aportación mensual':'manual')+'</small></div><button class="btn danger sm" onclick="A.delContrib(\''+g.id+'\',\''+c.id+'\')">✕</button></div>').join('')+'</details>':'')+'</div>'
  }).join('')
}
A.planContrib=function(id){const g=D.goals.find(x=>x.id===id),k=curKey(),left=r2(g.monthly-goalMonth(g,k));if(left<=0)return;addContrib(g,left,'plan',k,g.fromAcc);save();toast('Aportados '+money(left)+' a '+g.name);render()};
A.delGoal=function(id){if(!confirm('¿Eliminar este objetivo y su historial?'))return;const g=D.goals.find(x=>x.id===id),back=g.contribs.filter(c=>c.acc&&accById(c.acc));const tot=r2(back.reduce((s,c)=>s+c.amount,0));if(back.length&&tot!==0&&confirm('Este objetivo tiene '+money(tot)+' sacados de tus cuentas. ¿Devolverlos a sus cuentas de origen?'))back.forEach(c=>{const a=accById(c.acc);a.balance=r2(a.balance+c.amount);logTx(a.id,c.amount,'goal','Devolución de '+g.name)});D.goals=D.goals.filter(x=>x.id!==id);save();render()};
A.delContrib=function(gid,cid){const g=D.goals.find(x=>x.id===gid),c=g.contribs.find(z=>z.id===cid);if(c&&c.acc&&accById(c.acc)){const a=accById(c.acc);a.balance=r2(a.balance+c.amount);logTx(a.id,c.amount,'goal','Anulada aportación a '+g.name)}g.contribs=g.contribs.filter(z=>z.id!==cid);save();render()};
A.planAll=function(k){let n=0,t=0;D.goals.forEach(g=>{const left=r2(g.monthly-goalMonth(g,k));if(g.monthly>0&&left>0&&goalInfo(g).rem>0){addContrib(g,left,'plan',k,g.fromAcc);n++;t+=left}});save();toast(n?'Aportados '+money(t)+' a tus objetivos':'Nada pendiente');render()};

function initModal(M){
  const type=M.type,id=M.id;
  if(type==='goal'){const g=id&&D.goals.find(x=>x.id===id);M.f=g?{name:g.name,target:String(g.target),monthly:String(g.monthly||''),deadline:g.deadline||'',emoji:g.emoji,fromAcc:g.fromAcc||''}:{name:'',target:'',monthly:'',deadline:'',emoji:'🚗',fromAcc:''}}
  if(type==='contrib'){const g=D.goals.find(x=>x.id===id);M.f={acc:(g&&g.fromAcc)||''}}
  if(type==='surplus'){M.k=id;M.cat=(catOf('ocio')&&'ocio')||(D.cats[0]&&D.cats[0].id);M.f={}}
  if(type==='acct'){const a=id&&accById(id);M.f=a?{name:a.name,type:a.type,balance:String(a.balance),tae:a.tae?String(a.tae):'',freq:a.freq||'mensual'}:{name:'',type:'remunerada',balance:'',tae:'',freq:'mensual'}}
  if(type==='flow'){const f=id&&D.flows.find(x=>x.id===id);M.f=f?{name:f.name,from:f.from,to:f.to,amount:String(f.amount),day:String(f.day),auto:!!f.auto}:{name:'',from:'ext',to:D.settings.spendAcc||(D.accounts[0]&&D.accounts[0].id)||'',amount:'',day:'1',auto:false}}
  if(type==='xfer'){M.f={from:id||(D.accounts[0]&&D.accounts[0].id)||'',to:(D.accounts.find(a=>a.id!==id)||{}).id||'',amount:'',note:''}}
  if(type==='adjust'){const a=accById(id);M.f={balance:a?String(a.balance):''}}
  if(type==='interest'){const a=accById(id),p=a&&pendingInterest(a);M.f={amount:p?String(p.amt):''}}
}

A.mfPick=function(f,v){S.modal.f[f]=v;render()};
A.surpSet=function(key,v){S.modal.f[key]=num(v);updSurp()};

function surpSum(){const M=S.modal;return r2(Object.keys(M.f).reduce((s,k)=>s+(+M.f[k]||0),0))}
function updSurp(){const e=$id('surpRest');if(!e||!S.modal||S.modal.type!=='surplus')return;const av=extraAvail(S.modal.k),rest=r2(av-surpSum());e.innerHTML=rest>=-0.005?'Se queda como ahorro libre: <b>'+money(rest)+'</b>':'<span class="neg">Te pasas por '+money(-rest)+'</span>'}

const IMP={
  decode(buf){let t=new TextDecoder('utf-8').decode(buf);if(t.indexOf('\uFFFD')>=0)t=new TextDecoder('windows-1252').decode(buf);return t.replace(/^\uFEFF/,'')},
  splitLine(line,d){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===d&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())},
  date(s){s=String(s||'').trim().replace(/"/g,'');let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);let d,mo,y;
    if(m){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}else{m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(!m)return null;y=+m[1];mo=+m[2];d=+m[3]}

  async pdfLines(buf){

function reportInsights(k){

  const sp=spentTot(k),sav=r2(m.income-sp),rate=m.income>0?Math.round(sav/m.income*100):0,pk=shiftKey(k,-1),ps=spentTot(pk);
  const items=D.cats.map(c=>({label:c.name,value:spentCat(k,c.id),color:catColor(c.id),emoji:c.emoji})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const known=sumArr(items.map(x=>x.value)),other=r2(sp-known);if(other>0.004)items.push({label:'Sin categoría',value:other,color:'#94A3B8',emoji:'❔'});
  const top5=monthExp(k).slice().sort((a,b)=>b.amount-a.amount).slice(0,5);
  const cmp=ps>0?D.cats.map(c=>({c:c,d:r2(spentCat(k,c.id)-spentCat(pk,c.id))})).filter(x=>Math.abs(x.d)>=1).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,5):[];

   '<div class="card"><h3>Calendario de gasto</h3><p class="tiny" style="margin:2px 0 8px">Cuanto más oscuro, más gastaste ese día. Toca un día para ver el detalle.</p>'+calHTML(k)+'</div>'+
   '<div class="card"><h3>Gasto por día de la semana</h3>'+weekdayHTML(k)+'</div>'+
   (top5.length?'<div class="card"><h3>Mayores gastos</h3>'+top5.map((e,i)=>'<div class="leg"><span>'+(i+1)+'. '+esc(catName(e.cat))+(e.note?' · '+esc(e.note):'')+' <span class="tiny">'+fmtD(e.date).slice(0,5)+'</span></span><b>'+money(e.amount)+'</b></div>').join('')+'</div>':'')+
   (cmp.length?'<div class="card"><h3>Frente a '+mLabel(pk).split(' ')[0].toLowerCase()+'</h3>'+cmp.map(x=>'<div class="leg"><span>'+x.c.emoji+' '+esc(x.c.name)+'</span><b class="'+(x.d>0?'neg':'pos')+'">'+(x.d>0?'▲ +':'▼ ')+money(x.d)+'</b></div>').join('')+'</div>':'')+
   nbCard(k)+'<div class="card"><h3>🔁 Gastos recurrentes</h3>'+(rec.length?'<p class="tiny" style="margin:2px 0 6px">Cargos que se repiten cada mes. Total aprox.: <b>'+money(sumArr(rec.map(r=>r.avg)))+'/mes</b> ('+money(sumArr(rec.map(r=>r.avg))*12)+'/año).</p>'+rec.slice(0,8).map(r=>'<div class="leg"><span>'+esc(catOf(r.cat)?catOf(r.cat).emoji:'❔')+' '+esc(r.name)+' <span class="tiny">· '+r.months+' meses</span></span><b>'+money(r.avg)+'</b></div>').join(''):'<div class="tiny">Cuando haya al menos dos meses con el mismo cargo (por ejemplo una suscripción), aparecerá aquí.</div>')+'</div>'

/* ============ V4: CUENTAS, FLUJOS, INTERESES, PROYECCIÓN ============ */
const TYPES={corriente:'Cuenta corriente',remunerada:'Cuenta remunerada',inversion:'Inversión'};
const TEMO={corriente:'🏦',remunerada:'💰',inversion:'📈'};
const FREQ={diaria:['Diaria',1],mensual:['Mensual',1],trimestral:['Trimestral',3],semestral:['Semestral',6],anual:['Anual',12]};
const accById=id=>(D.accounts||[]).find(a=>a.id===id);
const taxF=()=>1-(+D.settings.taxPct||0)/100;
const periodMonths=a=>(FREQ[a.freq]||FREQ.mensual)[1];
const periodInterest=(a,bal)=>bal*(Math.pow(1+(+a.tae||0)/100,periodMonths(a)/12)-1);
const dparse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function addMonthsISO(s,n){const d=dparse(s);return iso(new Date(d.getFullYear(),d.getMonth()+n,Math.min(d.getDate(),28)))}
function logTx(accId,amount,type,note,date){D.atx.push({id:uid(),acc:accId,amount:r2(amount),type:type,note:note||'',date:date||todayISO()})}
function moveMoney(from,to,amount,note,type,date){
  const fa=accById(from),ta=accById(to);
  if(fa){fa.balance=r2(fa.balance-amount);logTx(from,-amount,type||'transfer',note,date)}
  if(ta){ta.balance=r2(ta.balance+amount);logTx(to,amount,type||'transfer',note,date)}
}
function spendAdj(x,sign){if(!x||x.src==='bank'||!x.acc)return;const a=accById(x.acc);if(a)a.balance=r2(a.balance+sign*x.amount)}
function totalWealth(){return r2(D.accounts.reduce((s,a)=>s+a.balance,0))}
function flowIncome(){const sp=D.settings.spendAcc;if(!sp)return 0;return r2(D.flows.filter(f=>f.to===sp&&f.from!==sp).reduce((s,f)=>s+f.amount,0))}
function expectedExpense(){
  const cur=curKey(),ks=Object.keys(D.months).filter(k=>k<cur&&spentTot(k)>0).sort().slice(-3);
  if(ks.length)return r2(ks.reduce((s,k)=>s+spentTot(k),0)/ks.length);
  const m=D.months[cur];return m?r2(D.cats.reduce((s,c)=>s+catBudget(cur,c.id),0)):0
}
function pendingInterest(a){
  if(a.type!=='remunerada'||!(a.tae>0)||a.balance<=0)return null;
  const pm=periodMonths(a),today=dparse(todayISO()),last=a.lastInt||todayISO();let n=0;
  for(let i=1;i<=60;i++){if(dparse(addMonthsISO(last,pm*i))<=today)n=i;else break}
  if(!n)return null;
  return{n:n,amt:r2(periodInterest(a,a.balance)*n*taxF())}
}
function dueCount(f){const cur=curKey();let n=monthDiff(f.last||cur,cur);if(new Date().getDate()<f.day)n-=1;return Math.max(0,Math.min(n,12))}
function applyFlow(f,times){for(let i=1;i<=times;i++){const k=shiftKey(f.last,i);moveMoney(f.from,f.to,f.amount,f.name,f.from==='ext'?'income':'transfer',k+'-'+pad(Math.min(f.day,28)))}f.last=shiftKey(f.last,times)}
function runAutos(){let n=0;(D.flows||[]).forEach(f=>{if(f.auto){const c=dueCount(f);if(c>0){applyFlow(f,c);n+=c}}});if(n){save();setTimeout(()=>toast('Se aplicaron '+n+' operaciones automáticas'),500)}}

function project(N,expM){
  const accs=D.accounts.map(a=>({a:a,bal:a.balance,acr:0,int:0,ser:[a.balance],zero:null,contrib:0})),by={};accs.forEach(x=>by[x.a.id]=x);
  for(let m=1;m<=N;m++){
    D.flows.forEach(f=>{if(by[f.from]){by[f.from].bal-=f.amount;by[f.from].contrib-=f.amount}if(by[f.to]){by[f.to].bal+=f.amount;by[f.to].contrib+=f.amount}});
    const sp=by[D.settings.spendAcc];if(expM>0&&sp){sp.bal-=expM;sp.contrib-=expM}
    accs.forEach(x=>{const a=x.a;
      if((a.type==='remunerada'||a.type==='inversion')&&a.tae>0){
        const pm=a.type==='inversion'?1:periodMonths(a),n=12/pm,t=a.tae/100,rm=n*(Math.pow(1+t,1/n)-1)/12;
        if(x.bal>0)x.acr+=x.bal*rm;
        if(m%pm===0){const c=x.acr*(a.type==='remunerada'?taxF():1);x.bal+=c;x.int+=c;x.acr=0}
      }
      if(x.zero===null&&x.bal<0)x.zero=m;
      x.ser.push(r2(x.bal))});
  }
  return accs
}
function svgProj(res,N){
  const tot=[];for(let i=0;i<=N;i++)tot.push(r2(res.reduce((s,x)=>s+x.ser[i],0)));
  const all=res.map(x=>x.ser).concat([tot]),flat=all.reduce((a,b)=>a.concat(b),[]);
  const hi=Math.max.apply(null,flat.concat([1]))*1.08,lo=Math.min(0,Math.min.apply(null,flat)*1.08),W=320,H=190,L=40,R=8,T=10,B=22;
  const x=i=>L+(W-L-R)*i/Math.max(1,N),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s='';[lo<0?lo:null,0,hi/1.08/2,hi/1.08].forEach(v=>{if(v===null)return;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)"></line><text x="'+(L-4)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut)">'+Math.round(v)+'</text>'});
  [0,Math.round(N/2),N].forEach(i=>{s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="var(--mut)">'+(i===0?'hoy':mShort(shiftKey(curKey(),i)))+'</text>'});
  const line=(ser,col,w)=>{let p='';ser.forEach((v,i)=>{p+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '});return'<path d="'+p+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round"></path>'};
  res.forEach((r,i)=>{s+=line(r.ser,PAL[i%PAL.length],1.8)});s+=line(tot,'var(--tx)',2.8);
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+s+'</svg><div class="tiny" style="display:flex;gap:10px;flex-wrap:wrap">'+res.map((r,i)=>'<span><b style="color:'+PAL[i%PAL.length]+'">━</b> '+esc(r.a.name)+'</span>').join('')+'<span><b>━</b> Total</span></div>'
}

const G={token:null,exp:0,scopes:[]};
const SC_DRIVE='https://www.googleapis.com/auth/drive.appdata',SC_SHEETS='https://www.googleapis.com/auth/spreadsheets',SC_CAL='https://www.googleapis.com/auth/calendar.events';
function gCfg(){D.settings.google=D.settings.google||{clientId:'',auto:false};return D.settings.google}
function gLoad(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>res();s.onerror=()=>rej(new Error('No se pudo cargar Google (¿sin conexión?)'));document.head.appendChild(s)})}
async function gToken(scopes){
  const cid=gClient();if(!cid)throw new Error('Google aún no está configurado en esta app (falta el ID de cliente)');
  if(location.protocol==='file:')throw new Error('Google no permite conectar desde un archivo local (file://). Abre MyFin desde una dirección https:// o http://localhost.');
  if(G.token&&Date.now()<G.exp&&scopes.every(s=>G.scopes.indexOf(s)>=0))return G.token;
  await gLoad();
  return new Promise((res,rej)=>{
    const all=Array.from(new Set(G.scopes.concat(scopes)));
    const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:all.join(' '),
      callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));G.token=r.access_token;G.exp=Date.now()+(r.expires_in-60)*1000;G.scopes=all;res(G.token)},
      error_callback:e=>rej(new Error(e.message||e.type||'Autorización cancelada'))});
    tc.requestAccessToken({prompt:G.token?'':'consent'})
  })
}
async function gFetch(url,opts,scopes){
  const t=await gToken(scopes);opts=opts||{};opts.headers=Object.assign({Authorization:'Bearer '+t},opts.headers||{});
  const r=await fetch(url,opts);
  if(!r.ok){let m=String(r.status);try{const j=await r.json();m=(j.error&&j.error.message)||m}catch(e){}throw new Error('Google: '+m)}
  const ct=r.headers.get('content-type')||'';return ct.indexOf('json')>=0?r.json():r.text()
}

    const sp=spentTot(k);
    const res=[['Informe MyFin',mLabel(k)],['Ingresos',m.income],['Gastado',sp],['Ahorro real',r2(m.income-sp)],['Objetivo de ahorro',saveAmt(m)],[],['Categoría','Presupuesto','Gastado','Restante']].concat(D.cats.filter(c=>catBudget(k,c.id)>0||spentCat(k,c.id)>0).map(c=>[c.name,catBudget(k,c.id),spentCat(k,c.id),r2(catBudget(k,c.id)-spentCat(k,c.id))]));
    const gas=[['Fecha','Categoría','Importe','Nota']].concat(monthExp(k).slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,(catOf(e.cat)||{name:'Sin categoría'}).name,e.amount,e.note||'']));
    const acc=[['Cuenta','Tipo','Saldo','TAE / rentabilidad %']].concat(D.accounts.map(a=>[a.name,TYPES[a.type],a.balance,a.tae||'']));
    const ss=await gFetch('https://sheets.googleapis.com/v4/spreadsheets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({properties:{title:'MyFin · '+mLabel(k)},sheets:[{properties:{title:'Resumen'}},{properties:{title:'Gastos'}},{properties:{title:'Cuentas'}}]})},[SC_SHEETS]);
    await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+ss.spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'USER_ENTERED',data:[{range:'Resumen!A1',values:res},{range:'Gastos!A1',values:gas},{range:'Cuentas!A1',values:acc}]})},[SC_SHEETS]);
    toast('Hoja creada en tu Google Drive');window.open(ss.spreadsheetUrl,'_blank')
  }catch(e){toast(e.message)}finally{S.g.busy='';render()}
};
A.gCalendar=async function(){
  const items=[];D.flows.forEach(f=>items.push({o:f,t:'💸 MyFin: '+f.name+' ('+money(f.amount)+')',day:f.day}));
  D.goals.forEach(g=>{if(g.monthly>0)items.push({o:g,t:'🎯 MyFin: aportar '+money(g.monthly)+' a '+g.name,day:1})});
  if(!items.length){toast('No tienes flujos ni objetivos con aportación mensual');return}
  const todo=items.filter(i=>!i.o.gcal);if(!todo.length){toast('Ya están creados todos los recordatorios');return}
  try{gBusy('Creando eventos en Google Calendar…');let n=0;
    for(const it of todo){const now=new Date();let mo=now.getMonth();if(now.getDate()>it.day)mo++;
      const d0=new Date(now.getFullYear(),mo,it.day),d1=new Date(now.getFullYear(),mo,it.day+1);
      const ev=await gFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary:it.t,start:{date:iso(d0)},end:{date:iso(d1)},recurrence:['RRULE:FREQ=MONTHLY'],reminders:{useDefault:false,overrides:[{method:'popup',minutes:480}]}})},[SC_CAL]);
      it.o.gcal=ev.id;n++}
    save();toast('Creados '+n+' recordatorios mensuales')
  }catch(e){toast(e.message)}finally{S.g.busy='';render()}
};

A.importData=function(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=function(){try{const o=JSON.parse(rd.result);if(!o||!o.cats||!o.months)throw new Error('Archivo no válido');if(!confirm('Esto reemplazará los datos actuales de esta cuenta. ¿Continuar?'))return;DB.users[DB.session].data=o;D=o;save();applyTheme();toast('Datos importados');S.view=curKey();A.go('home')}catch(e){toast('No se pudo importar: '+e.message)}};rd.readAsText(f)};
window.addEventListener('error',function(e){const a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.innerHTML='<div style="padding:24px"><h2>Algo ha fallado</h2><p>'+String(e.message)+'</p><p>Haz una captura y envíamela.</p></div>'});

/* ---- Pagar con: paga mensual o cualquier cuenta ---- */
function payAcc(e){const s=e.src===undefined?'paga':e.src;return s==='paga'?(D.settings.spendAcc||''):s}

A.googleLogin=async function(){
  try{
    const t=await gToken([SC_DRIVE,'openid','email','profile']);
    const ui=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json());
    const email=String(ui.email||'').toLowerCase();if(!email)throw new Error('No he podido leer tu correo de Google');
    let u=DB.users[email];if(!u){u=DB.users[email]={hash:'google',google:true,data:newUserData(email,ui.name)}}
    DB.session=email;D=u.data;ensureData();G.email=email;
    if(isPlus()){try{const f=await gDriveFind();if(f){const remote=await gFetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{},[SC_DRIVE]);
      if(remote&&remote.cats&&(remote.updatedAt||0)>(D.updatedAt||0)){remote.settings=remote.settings||{};DB.users[email].data=remote;D=remote;ensureData()}}}catch(e){}}
    persist();S.auth.err='';A.afterLogin()
  }catch(e){S.auth.err=e.message||String(e);S.screen='auth';render()}
};
